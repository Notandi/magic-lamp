<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Code-built lamp</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0710; overflow: hidden; }
  #note { position: fixed; left: 16px; bottom: 16px; color: #b9a6d8; font: 13px system-ui, sans-serif; opacity: .8; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="note">Code-built lamp prototype · drag to orbit</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0710);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.6;

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
camera.position.set(1.5, 2.6, 6.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.3, 0.9, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;

// Lights: warm candle key + purple magic rim
const key = new THREE.PointLight(0xffb060, 40, 20, 2);
key.position.set(2.5, 3.5, 3);
key.castShadow = true;
scene.add(key);
const rim = new THREE.PointLight(0x8a5cff, 25, 20, 2);
rim.position.set(-3, 2, -2.5);
scene.add(rim);
scene.add(new THREE.AmbientLight(0x30204a, 0.4));

const brass = new THREE.MeshPhysicalMaterial({
  color: 0xd4a03a, metalness: 1, roughness: 0.22, clearcoat: 0.6, clearcoatRoughness: 0.15,
});
const darkBrass = brass.clone();
darkBrass.color.set(0x9a6a1e);
darkBrass.roughness = 0.35;

const lamp = new THREE.Group();
scene.add(lamp);
const add = (geo, mat = brass) => {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = m.receiveShadow = true;
  lamp.add(m);
  return m;
};
const lathe = (pts, seg = 96) => new THREE.LatheGeometry(pts.map(([x, y]) => new THREE.Vector2(x, y)), seg);

// Foot / pedestal
add(lathe([[0, 0], [0.62, 0], [0.64, 0.04], [0.55, 0.09], [0.3, 0.16], [0.24, 0.28], [0.3, 0.36], [0, 0.36]]), darkBrass);

// Body: lathed oval, stretched front-to-back so it reads as a genie lamp
const bodyPts = [];
for (let i = 0; i <= 40; i++) {
  const a = -Math.PI / 2 + (i / 40) * Math.PI;
  const r = Math.cos(a) * (1 + 0.12 * Math.sin(a)); // slightly fuller at top
  bodyPts.push([Math.max(r, 0.0001), 0.85 + Math.sin(a) * 0.52]);
}
const body = add(lathe(bodyPts));
body.scale.set(1.35, 1, 0.85);

// Decorative band around the body's waist
const band = add(new THREE.TorusGeometry(1.0, 0.035, 16, 128), darkBrass);
band.rotation.x = Math.PI / 2;
band.position.y = 0.9;
band.scale.set(1.35, 0.85, 1);

// Neck + lid + finial
add(lathe([[0, 1.3], [0.42, 1.3], [0.36, 1.42], [0.4, 1.48], [0, 1.48]]), darkBrass);
add(lathe([[0, 1.48], [0.38, 1.48], [0.34, 1.6], [0.22, 1.72], [0.1, 1.8], [0, 1.82]]));
add(lathe([[0, 1.8], [0.06, 1.82], [0.05, 1.9], [0.1, 1.98], [0.06, 2.06], [0, 2.1]]), darkBrass);
const gem = add(new THREE.IcosahedronGeometry(0.06, 2), new THREE.MeshPhysicalMaterial({
  color: 0x9b4dff, emissive: 0x5a1fbf, emissiveIntensity: 1.2, roughness: 0.1, transmission: 0.3,
}));
gem.position.y = 2.12;

// Tapered tube helper: thick at start, thin at end
function taperedTube(curve, r0, r1, tubular = 80, radial = 24) {
  const geo = new THREE.TubeGeometry(curve, tubular, 1, radial, false);
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i <= tubular; i++) {
    const t = i / tubular;
    const c = curve.getPointAt(t);
    const r = THREE.MathUtils.lerp(r0, r1, Math.pow(t, 0.8));
    for (let j = 0; j <= radial; j++) {
      const k = i * (radial + 1) + j;
      v.fromBufferAttribute(pos, k).sub(c).multiplyScalar(r).add(c);
      pos.setXYZ(k, v.x, v.y, v.z);
    }
  }
  geo.computeVertexNormals();
  return geo;
}

// Spout: sweeps forward and up from the body
const spoutCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0.95, 0.8, 0),
  new THREE.Vector3(1.55, 0.92, 0),
  new THREE.Vector3(2.1, 1.12, 0),
  new THREE.Vector3(2.5, 1.42, 0),
  new THREE.Vector3(2.68, 1.6, 0),
]);
add(taperedTube(spoutCurve, 0.32, 0.075));
const lip = add(new THREE.TorusGeometry(0.08, 0.02, 12, 32), darkBrass);
const tip = spoutCurve.getPointAt(1);
const tan = spoutCurve.getTangentAt(1);
lip.position.copy(tip);
lip.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), tan);

// Handle: curled loop at the back
const handleCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-1.2, 1.15, 0),
  new THREE.Vector3(-1.75, 1.35, 0),
  new THREE.Vector3(-2.05, 1.05, 0),
  new THREE.Vector3(-1.85, 0.62, 0),
  new THREE.Vector3(-1.4, 0.55, 0),
  new THREE.Vector3(-1.15, 0.62, 0),
]);
add(new THREE.TubeGeometry(handleCurve, 80, 0.07, 20, false), darkBrass);
const curl = add(new THREE.SphereGeometry(0.1, 24, 16), darkBrass);
curl.position.set(-1.75, 1.38, 0);

lamp.position.x = -0.3;

// Floor to catch the shadow
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(6, 64),
  new THREE.MeshStandardMaterial({ color: 0x140c1e, roughness: 0.9 }),
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  key.intensity = 40 + Math.sin(t * 7) * 2 + Math.sin(t * 13) * 1.5; // candle flicker
  gem.material.emissiveIntensity = 1 + Math.sin(t * 2) * 0.4;
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
